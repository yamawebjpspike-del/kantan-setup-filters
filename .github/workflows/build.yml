name: Build blocklist

on:
  # 毎週月曜 03:00 UTC（日本時間 12:00）に実行
  schedule:
    - cron: "0 3 * * 1"
  # 手動実行も可能にしておく（テスト用）
  workflow_dispatch:
  # 変換のしかたを変えたときは、その場で確かめる
  push:
    paths:
      - "tools/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    # ■ ubuntu ではなく macOS で動かしている理由
    #
    # 出来上がったルールを Safari が本当に読み込めるかは、
    # WebKit に通してみないと分からない。そして WebKit は macOS にしかない。
    #
    # Safari の url-filter は正規表現のごく一部しか解さず、
    # 解せない書き方が **1 行混ざるだけでルールセット全体が読み込まれなくなる**。
    # 一部が効かなくなるのではなく、全部が効かなくなり、
    # しかも iPhone は黙って何もしないだけなので誰も気づけない。
    #
    # EasyList は毎週書き換わる。来週その 1 行が入ってくるかもしれない。
    # 検証なしで自動公開するのは、全利用者の広告ブロックを
    # 気づかないうちに止めてしまう危険を抱え続けることになる。
    #
    # 公開リポジトリなので macOS の実行時間も無料。
    runs-on: macos-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: EasyList を変換
        run: |
          python3 tools/convert.py \
            --output docs/blocklist.json \
            --limit 120000 \
            --min-rules 1000

      - name: Safari が読み込めるか確かめる
        # ここで落ちれば、壊れたルールが公開されることはない。
        # 「変換は成功したが Safari は受け付けない」という状態を防ぐ最後の砦
        run: |
          xcrun --sdk macosx swiftc -O tools/verify_safari.swift -o /tmp/verify_safari
          /tmp/verify_safari docs/blocklist.json

      # ここまで来たものだけがコミットされる
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/blocklist.json
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "Update blocklist ($(date -u +%Y-%m-%d))"
            git push
          fi
